name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to publish
        required: true
        default: v0.0.12
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  publish:
    # Enable after configuring a Trusted Publisher for the repdf PyPI project.
    if: github.repository == 'codemee/repdf' && vars.PYPI_PUBLISH_ENABLED == 'true'
    name: Publish release distributions
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/repdf/
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.18"
      - name: Verify release version
        run: |
          uv run --no-project --python 3.12 python -c 'import os, tomllib; from pathlib import Path; version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["RELEASE_TAG"] == "v" + version, (os.environ["RELEASE_TAG"], version)'
      - name: Build release distributions
        run: uv build
      - name: Attach distributions to GitHub Release
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*

[project]
name = "repdf"
version = "0.0.10"
description = "RePDF (Rearrange PDF): select, reorder, merge and split PDF pages with a desktop GUI."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pillow>=11.0,<13",
    "pypdf>=5.0,<7",
    "pypdfium2>=4.30,<6",
    "pyside6>=6.8,<7",
]

[project.urls]
Homepage = "https://github.com/codemee/repdf"
Repository = "https://github.com/codemee/repdf"
Issues = "https://github.com/codemee/repdf/issues"

[project.scripts]
repdf = "repdf.entrypoint:main"

[dependency-groups]
build = [
    "pyinstaller>=6.16,<7",
]
dev = [
    "pytest>=8.3,<10",
    "pytest-qt>=4.4,<5",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
